services:
  rabbit1:
    image: rabbitmq:3.13-management
    hostname: rabbit1
    container_name: rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit1@rabbit1
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:?Definir en el entorno local}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?Definir en el entorno local}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Definir en el entorno local}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
    networks:
      - rabbitnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbit2:
    image: rabbitmq:3.13-management
    hostname: rabbit2
    container_name: rabbit2
    environment:
      RABBITMQ_NODENAME: rabbit2@rabbit2
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:?Definir en el entorno local}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?Definir en el entorno local}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Definir en el entorno local}"
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
    networks:
      - rabbitnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  rabbitnet:
    name: rabbitnet

volumes:
  rabbit1_data:
  rabbit2_data:
