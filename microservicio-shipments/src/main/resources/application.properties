server.port=9092
spring.application.name=ms-rutaexpress-shipments

# Conexión Oracle DB
spring.datasource.url=jdbc:oracle:thin:@//172.31.31.4:1521/FREEPDB1
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL Microservicio Catálogo
catalog.service.url=http://localhost:9091/api/catalog/services

# Configuración RabbitMQ
spring.rabbitmq.host=172.31.26.172
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
ruta.kafka.eventos=envios-eventos
ruta.kafka.auditoria=envios-auditoria
