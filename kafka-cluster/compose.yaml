name: rutaexpress-kafka
x-zk: &zk
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
x-zk-env: &zk-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 10
  ZOOKEEPER_SYNC_LIMIT: 5
  ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
  KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
x-broker: &broker
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
x-broker-env: &broker-env
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  zookeeper-1:
    <<: *zk
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 1
    ports: ["127.0.0.1:2181:2181"]
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log

  zookeeper-2:
    <<: *zk
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    ports: ["127.0.0.1:2182:2181"]
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log

  zookeeper-3:
    <<: *zk
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    ports: ["127.0.0.1:2183:2181"]
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log

  kafka-1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,HOST://localhost:29092"
    ports: ["127.0.0.1:29092:29092"]
    volumes: ["broker1-data:/var/lib/kafka/data"]

  kafka-2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:39092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,HOST://localhost:39092"
    ports: ["127.0.0.1:39092:39092"]
    volumes: ["broker2-data:/var/lib/kafka/data"]

  kafka-3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:49092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,HOST://localhost:49092"
    ports: ["127.0.0.1:49092:49092"]
    volumes: ["broker3-data:/var/lib/kafka/data"]

  kafka-admin:
    profiles: [app]
    build: ../microservicio-kafka-admin
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports: ["127.0.0.1:9095:9095"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      KAFKA_CLUSTERS_0_NAME: RutaExpress
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports: ["127.0.0.1:8080:8080"]

networks:
  default:
    name: rutaexpress-kafka

volumes:
  zk1-data: {}
  zk1-log: {}
  broker1-data: {}
  zk2-data: {}
  zk2-log: {}
  broker2-data: {}
  zk3-data: {}
  zk3-log: {}
  broker3-data: {}
